name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Frontend Dependencies & Build
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
        
    - name: Copy Frontend Build to Backend Static Folder
      run: |
        mkdir -p backend/static
        cp -R frontend/dist/* backend/static/

    - name: Package App for Deployment
      run: |
        # We need to deploy the backend folder's contents to the Azure App Service root
        cd backend
        zip -r ../deployment.zip ./*

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # Or hardcode if you prefer
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deployment.zip
